name: Jeeves
description: >-
  Jeeves is a global financial platform for cross-border businesses, combining
  corporate cards (physical and virtual with spend controls and cashback),
  automated expense management with approval flows and policy enforcement,
  cross-border payments and transfers to 150+ countries in 40+ currencies,
  instant and stablecoin-based settlement, non-dilutive corporate credit, and
  AI-driven spend insights. Jeeves operates across Brazil, Colombia, Mexico,
  Canada, the USA, the UK, and the European Union, serving globally operating
  companies. Backed by a16z and CRV, the company is tracked in the API
  Evangelist network; no public developer API or documentation surface was
  found at the time of enrichment.
